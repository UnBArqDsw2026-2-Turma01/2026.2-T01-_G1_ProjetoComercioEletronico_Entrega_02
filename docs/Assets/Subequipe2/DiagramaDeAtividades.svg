<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" width="1060" height="920" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Cabeçalho / Título do Diagrama -->
  <rect x="20" y="15" width="1020" height="50" rx="6" fill="#1e293b" />
  <text x="40" y="46" fill="#ffffff" font-size="19" font-weight="bold">Diagrama de Atividades UML — Fluxo de Busca e Filtros (Mercado Livre)</text>
  <text x="860" y="46" fill="#94a3b8" font-size="13">Subequipe 02 • Notação UML 2.5</text>

  <!-- ==================== PARTIÇÕES / SWIMLANES ==================== -->
  <!-- Raia 1: Comprador -->
  <rect x="20" y="75" width="245" height="825" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="20" y="75" width="245" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="75" y="101" fill="#1e293b" font-size="15" font-weight="bold">«partition» Comprador</text>

  <!-- Raia 2: Interface (Frontend) -->
  <rect x="265" y="75" width="250" height="825" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="265" y="75" width="250" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="315" y="101" fill="#1e293b" font-size="15" font-weight="bold">«partition» Interface</text>

  <!-- Raia 3: Motor de Busca (Backend) -->
  <rect x="515" y="75" width="270" height="825" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="515" y="75" width="270" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="560" y="101" fill="#1e293b" font-size="15" font-weight="bold">«partition» MotorBusca</text>

  <!-- Raia 4: Serviços & Índice -->
  <rect x="785" y="75" width="255" height="825" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="785" y="75" width="255" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="825" y="101" fill="#1e293b" font-size="15" font-weight="bold">«partition» Dados &amp; Ads</text>

  <!-- ==================== FLUXO E AÇÕES ==================== -->

  <!-- Nó Inicial (Comprador) -->
  <circle cx="142" cy="145" r="12" fill="#0f172a" />
  <line x1="142" y1="157" x2="142" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação 1: Digitar termo -->
  <g filter="url(#shadow)" transform="translate(45, 185)">
    <rect width="195" height="50" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="97" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Digitar termo na barra</text>
    <text x="97" y="39" text-anchor="middle" fill="#0369a1" font-size="11">de pesquisa</text>
  </g>

  <line x1="240" y1="210" x2="310" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação 2: Capturar e debouncer -->
  <g filter="url(#shadow)" transform="translate(310, 185)">
    <rect width="170" height="50" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="85" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Aplicar debounce (300ms)</text>
    <text x="85" y="39" text-anchor="middle" fill="#0369a1" font-size="11">&amp; submeter busca</text>
  </g>

  <line x1="480" y1="210" x2="560" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação 3: Receber query e sanitizar -->
  <g filter="url(#shadow)" transform="translate(560, 185)">
    <rect width="180" height="50" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="90" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Sanitizar query &amp;</text>
    <text x="90" y="39" text-anchor="middle" fill="#1d4ed8" font-size="11">extrair parâmetros</text>
  </g>

  <line x1="650" y1="235" x2="650" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- FORK NODE: Barra grossa de paralelismo -->
  <line x1="570" y1="275" x2="980" y2="275" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <text x="775" y="265" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">«fork» Consultas Concorrentes</text>

  <!-- Linhas saindo do Fork para as ações paralelas -->
  <line x1="830" y1="278" x2="830" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="940" y1="278" x2="940" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação 4a: Consultar Índice (Elasticsearch) -->
  <g filter="url(#shadow)" transform="translate(800, 310)">
    <rect width="105" height="55" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
    <text x="52" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Consultar Índice</text>
    <text x="52" y="37" text-anchor="middle" fill="#047857" font-size="10.5">(Elasticsearch)</text>
    <text x="52" y="49" text-anchor="middle" fill="#475569" font-size="9.5">Texto &amp; Facetas</text>
  </g>

  <!-- Ação 4b: Consultar Ads (Mercado Ads) -->
  <g filter="url(#shadow)" transform="translate(915, 310)">
    <rect width="105" height="55" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <text x="52" y="23" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Consultar Ads</text>
    <text x="52" y="37" text-anchor="middle" fill="#be123c" font-size="10.5">(Mercado Ads)</text>
    <text x="52" y="49" text-anchor="middle" fill="#475569" font-size="9.5">Leilão RTB</text>
  </g>

  <!-- Linhas entrando no Join -->
  <line x1="852" y1="365" x2="852" y2="400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="967" y1="365" x2="967" y2="400" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- JOIN NODE: Barra grossa de sincronização -->
  <line x1="810" y1="405" x2="990" y2="405" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <text x="900" y="423" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">«join» Sincronização de Respostas</text>

  <!-- Linha do Join para Mesclagem e Ranqueamento no Motor -->
  <path d="M 810 405 L 750 405 L 750 450 L 740 450" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação 5: Mesclar e Ranquear -->
  <g filter="url(#shadow)" transform="translate(555, 425)">
    <rect width="185" height="55" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="92" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Mesclar produtos &amp; Ads</text>
    <text x="92" y="39" text-anchor="middle" fill="#6d28d9" font-size="11">e aplicar Score Relevância</text>
  </g>

  <line x1="647" y1="480" x2="647" y2="515" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decisão 1: Encontrou resultados? -->
  <g transform="translate(647, 535)">
    <polygon points="0,-20 25,0 0,20 -25,0" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  </g>
  <text x="680" y="532" fill="#92400e" font-size="11.5" font-weight="bold">[Resultados > 0?]</text>

  <!-- Caminho NÃO: Sem resultados -->
  <line x1="622" y1="535" x2="480" y2="535" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="520" y="525" fill="#b91c1c" font-size="11" font-weight="bold">[Não / Vazio]</text>

  <!-- Ação de Erro / Sem Resultados na Interface -->
  <g filter="url(#shadow)" transform="translate(295, 510)">
    <rect width="185" height="55" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="92" y="24" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">Renderizar 'Sem Resultados'</text>
    <text x="92" y="39" text-anchor="middle" fill="#7f1d1d" font-size="11">&amp; sugestões "Você quis dizer"</text>
  </g>

  <line x1="387" y1="565" x2="387" y2="615" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fim por Sem Resultados -->
  <g transform="translate(387, 630)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#dc2626" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#dc2626" />
  </g>
  <text x="410" y="635" fill="#991b1b" font-size="11">«flow final» Busca sem retorno</text>

  <!-- Caminho SIM: Com resultados -> Renderizar Grid -->
  <line x1="647" y1="555" x2="647" y2="690 L 485 690" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="585" fill="#15803d" font-size="11" font-weight="bold">[Sim / Itens Encontrados]</text>

  <!-- Ação 6: Renderizar Grid de Produtos (Interface) -->
  <g filter="url(#shadow)" transform="translate(295, 665)">
    <rect width="190" height="55" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="95" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Renderizar Grid de Produtos,</text>
    <text x="95" y="39" text-anchor="middle" fill="#0369a1" font-size="11">preços, tags FULL e filtros</text>
  </g>

  <line x1="295" y1="692" x2="225" y2="692" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decisão 2: Comprador refina filtros ou escolhe produto? (Comprador) -->
  <g transform="translate(195, 692)">
    <polygon points="0,-20 25,0 0,20 -25,0" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Ramo Refinar Filtros (Loop) -->
  <line x1="195" y1="672" x2="195" y2="610" stroke="#334155" stroke-width="2" />
  <text x="110" y="645" fill="#92400e" font-size="11" font-weight="bold">[Refinar filtros]</text>

  <g filter="url(#shadow)" transform="translate(45, 555)">
    <rect width="195" height="50" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
    <text x="97" y="23" text-anchor="middle" fill="#713f12" font-size="12" font-weight="bold">Selecionar filtro/ordem</text>
    <text x="97" y="38" text-anchor="middle" fill="#854d0e" font-size="11">(Faixa preço, Envio FULL, etc.)</text>
  </g>

  <!-- Linha de retorno do loop para a Interface com novos parâmetros -->
  <path d="M 142 555 L 142 490 L 395 490 L 395 240" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="150" y="480" fill="#854d0e" font-size="10.5">Loop: Reaplicar busca parametrizada</text>

  <!-- Ramo Selecionar Produto (Sucesso) -->
  <line x1="195" y1="712" x2="195" y2="760" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="205" y="735" fill="#15803d" font-size="11" font-weight="bold">[Selecionar produto]</text>

  <!-- Ação: Clicar no Produto -->
  <g filter="url(#shadow)" transform="translate(60, 760)">
    <rect width="170" height="45" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
    <text x="85" y="27" text-anchor="middle" fill="#065f46" font-size="12" font-weight="bold">Clicar no card do produto</text>
  </g>

  <line x1="230" y1="782" x2="310" y2="782" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Ação: Redirecionar para PDP (Product Detail Page) -->
  <g filter="url(#shadow)" transform="translate(310, 760)">
    <rect width="180" height="45" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
    <text x="90" y="27" text-anchor="middle" fill="#065f46" font-size="12" font-weight="bold">Redirecionar para Tela do Produto</text>
  </g>

  <line x1="490" y1="782" x2="570" y2="782" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fim de Atividade com Sucesso -->
  <g transform="translate(595, 782)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#0f172a" />
  </g>
  <text x="620" y="787" fill="#0f172a" font-size="12" font-weight="bold">«activity final» Transição para Checkout</text>

  <!-- Legenda UML -->
  <g transform="translate(30, 885)">
    <circle cx="10" cy="8" r="6" fill="#0f172a" />
    <text x="22" y="12" fill="#64748b" font-size="11">Nó Inicial</text>
    <line x1="90" y1="8" x2="120" y2="8" stroke="#0f172a" stroke-width="4" />
    <text x="125" y="12" fill="#64748b" font-size="11">Fork / Join (Concorrência)</text>
    <polygon points="265,3 273,8 265,13 257,8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="280" y="12" fill="#64748b" font-size="11">Decisão / Merge</text>
    <circle cx="395" cy="8" r="7" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="395" cy="8" r="4" fill="#0f172a" />
    <text x="410" y="12" fill="#64748b" font-size="11">Nó Final de Atividade</text>
  </g>
</svg>
